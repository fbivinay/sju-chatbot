<script>
// ═══════════════ SJU ADMISSION ASSISTANT ═══════════════
// State
const state = { level: null, course: null, history: [], openedLinks: [] };

// Detect which programme a free-typed question is actually about, so the
// option-card buttons (Programme Info / Fees / ...) point at that programme
// instead of staying stuck on whatever was last clicked in the dropdown.
const NAME_ABBREVIATIONS = { bda: "big data analytics" };
const CORE_STOPWORDS = new Set(["the","and","for","with","bachelor","master","science","commerce",
  "business","administration","diploma","postgraduate","programme","program","study","studies","degree"]);
function coreTokens(str){
  return str.toLowerCase().replace(/[().]/g,"").split(/\s+/).filter(w=>w.length>2 && !CORE_STOPWORDS.has(w));
}
function expandAbbrev(text){
  return text.toLowerCase().split(/\s+/).map(w=>NAME_ABBREVIATIONS[w]||w).join(" ");
}
let _allCourses=null;
function allCourses(){
  if(!_allCourses) _allCourses=[].concat(...Object.entries(PROGRAMMES).map(([lvl,list])=>list.map(c=>({...c,level:lvl}))));
  return _allCourses;
}
// Degree words repeat across every programme at a level, so they can never
// identify a programme on their own - only the subject words can.
const DEGREE_TOKENS = new Set(["msc","bsc","bca","mca","bba","bcom","mcom","bsw","msw","bvoc","phd",
  "master","masters","bachelor","bachelors","executive"]);
function subjectTokens(str){ return coreTokens(str).filter(t=>!DEGREE_TOKENS.has(t)); }
// Which programmes could this free-typed question be about?
//   exact - every subject word of the programme name is in the question
//   loose - shares at least one subject word (question names a subject, not one programme)
function matchCourses(text){
  const q=new Set(coreTokens(expandAbbrev(text)));
  const degrees=[...q].filter(t=>DEGREE_TOKENS.has(t));
  const exact=[], loose=[];
  for(const c of allCourses()){
    const cAll=coreTokens(c.name), cSubj=subjectTokens(c.name);
    if(!cSubj.length) continue;
    // "msc chemistry" must not pull in the BSc or PhD chemistry programmes
    if(degrees.length && !degrees.some(d=>cAll.includes(d))) continue;
    if(!cSubj.some(t=>q.has(t))) continue;
    loose.push(c);
    if(cSubj.every(t=>q.has(t))) exact.push(c);
  }
  if(!loose.length){
    // No subject words, just a degree: "MCA", "BBA", "B.Com" name that degree's main programme.
    const named=degrees.map(degreeProgramme).filter(Boolean);
    return {exact:named, loose:named};
  }
  return {exact:exact, loose:loose};
}
// The programme that spells its degree out - "BCA (Bachelor of Computer Applications)",
// not "BCA (Data Analytics)" - is what the bare abbreviation means.
function degreeProgramme(deg){
  return allCourses().find(c=>coreTokens(c.name).includes(deg) && /\((bachelor|master) of /i.test(c.name));
}
let isOpen = false, sdIndex = -1;

// ── Official URLs (DATA: edit per-course URLs here) ──────────────
// ── Official URL routing (URLs verified from sju.edu.in/admissions/all-programmes) ──

const APPLY      = "https://sjuv4.linways.com/v4/adm-applicant/login";

const ALL_PROG   = SJU + "admissions/all-programmes";

// Each programme's official page has section anchors:
// #eligibility  #fee-structure  #admission (selection)  — verified on BCA page

  const page = path ? (path.indexOf('http')===0 ? path : SJU + path) : ALL_PROG;

    info:        page,
    fees:        page + "#fee-structure",

  };
}

const OPTION_CARDS = [
  { icon:"📘", label:"Programme Info",    key:"info" },
  { icon:"💰", label:"Fees",              key:"fees" },
  { icon:"✅", label:"Eligibility",       key:"eligibility" },
  { icon:"📅", label:"Important Dates",   key:"dates" },
  { icon:"📝", label:"How to Apply",      key:"apply" },
  { icon:"🎯", label:"Selection Process", key:"selection" },
];

// ── UI helpers ───────────────────────────────────────────────────
const $msgs = () => document.getElementById('cwMsgs');
const $inp  = () => document.getElementById('cwInput');
const $drop = () => document.getElementById('searchDrop');

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function botMsg(html){
  const d=document.createElement('div'); d.className='cmsg bot';
  d.innerHTML=`<div class="cav"><img src="/static/joey.svg" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div><div class="cbub">${html}</div>`;
  $msgs().appendChild(d); scrollDown();
  return d.querySelector('.cbub');
}
// AI answer (plain text with light Markdown) -> safe HTML. Runs on every streamed
// chunk, so it must also cope with half an answer.
function fmt(t){
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*\*/g,'')   // a bold whose closing ** hasn't streamed in yet
    .replace(/^#{1,6}[ \t]+(.*)$/gm,'<strong>$1</strong>')   // "### Fees" heading
    .replace(/^([ \t]*)[*-][ \t]+/gm,(m,sp)=>'&nbsp;'.repeat(sp.length*2)+'• ')   // "*   item" bullet, nested ones indented
    .replace(/\*(\S(?:[^*\n]*\S)?)\*/g,'<em>$1</em>')         // "*fees may change*"
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"'<>]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
function usrMsg(text){
  const d=document.createElement('div'); d.className='cmsg usr';
  d.innerHTML=`<div class="cbub">${esc(text)}</div>`;
  $msgs().appendChild(d); scrollDown();
}
function rawBlock(html){
  const d=document.createElement('div'); d.innerHTML=html;
  $msgs().appendChild(d.firstElementChild || d); scrollDown();
}
// New messages scroll into view. A streaming answer (follow=true) only keeps the view
// pinned while the student is already at the bottom, so scrolling up to reread isn't
// yanked back down every frame.
function scrollDown(follow){
  const b=$msgs();
  if(follow && b.scrollHeight-b.scrollTop-b.clientHeight>120) return;
  b.scrollTop=b.scrollHeight;
}
function showTyping(){
  const d=document.createElement('div'); d.className='cmsg bot'; d.id='cwTyping';
  d.innerHTML=`<div class="cav"><img src="/static/joey.svg" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div><div class="cbub"><span class="tdot" style="animation-delay:0s"></span><span class="tdot" style="animation-delay:.2s"></span><span class="tdot" style="animation-delay:.4s"></span></div>`;
  $msgs().appendChild(d); scrollDown();
}
function hideTyping(){ document.getElementById('cwTyping')?.remove(); }

// ── Welcome / Start Over ─────────────────────────────────────────
function startOver(){
  inflight?.abort();   // drop an answer still streaming into the old conversation
  state.level=null; state.course=null; state.history=[]; state.openedLinks=[];
  $msgs().innerHTML=''; hideDrop();
  $inp().value=''; syncInput();
  renderWelcome();
}
function renderWelcome(){
  botMsg(`Hi 👋 I’m <strong>Joey</strong>, your guide to St Joseph’s University!<br><br>Choose a programme level, or open any official page below:`);
  rawBlock(`<div class="lvl-btns" style="flex-wrap:wrap">
    <button class="lvl-btn" style="flex-basis:47%" onclick="pickLevel('UG')">🎓 Undergraduate<small>BCA · BSc · BBA · BCom · BA</small></button>
    <button class="lvl-btn" style="flex-basis:47%" onclick="pickLevel('PG')">📚 Postgraduate<small>MSc · MCA · MBA · MA · MSW</small></button>
    <button class="lvl-btn" style="flex-basis:47%" onclick="pickLevel('PGD')">📜 PG Diploma<small>Data Science · Cyber Security · etc</small></button>
    <button class="lvl-btn" style="flex-basis:47%" onclick="pickLevel('PHD')">🔬 PhD Programmes<small>Research degrees</small></button>
  </div>`);
  renderGlobalActions();
  $msgs().scrollTop = 0;
}
const LEVEL_NAMES = { UG:"Undergraduate", PG:"Postgraduate", PGD:"PG Diploma", PHD:"PhD" };
// The input's hint follows the state, so call this after every change to
// state.level / state.course instead of setting the placeholder by hand.
function syncInput(){
  $inp().placeholder = state.course ? 'Ask anything about this programme...'
    : state.level ? `Search ${LEVEL_NAMES[state.level]||state.level} programmes...`
    : 'Ask anything about SJU...';
}
function pickLevel(level){
  state.level=level; state.course=null;
  const lname=LEVEL_NAMES[level]||level;
  usrMsg(lname);
  botMsg(`Great! Please <strong>search or select</strong> the ${lname} programme you're interested in. 🔍<br><span style="font-size:14px;font-weight:700;opacity:.7">Start typing below — e.g. "data", "computer", "psych"...</span>`);
  syncInput();
  $inp().focus();
  showDrop(PROGRAMMES[level]);
}

// ── Course search dropdown ───────────────────────────────────────
function showDrop(list){
  const dd=$drop(); sdIndex=-1;
  if(!list.length){ dd.innerHTML=`<div class="sd-empty">No matching programme — press Enter to ask the AI instead</div>`; }
  else dd.innerHTML=list.map((c,i)=>`<div class="sd-item" data-name="${esc(c.name)}" onclick="chooseCourseByName(this.dataset.name)">${esc(c.name)}</div>`).join('');
  dd.classList.add('show');
}
function hideDrop(){ $drop().classList.remove('show'); sdIndex=-1; }
function filterCourses(q){
  const list=PROGRAMMES[state.level]||[];
  if(!q) return list;
  q=q.toLowerCase();
  return list.filter(c=>c.name.toLowerCase().includes(q));
}
function chooseCourseByName(name){
  const c=(PROGRAMMES[state.level]||[]).find(x=>x.name===name);
  if(c) selectCourse(c);
}
function selectCourse(c){
  state.course=c; if(c.level) state.level=c.level; hideDrop();
  $inp().value=''; syncInput();
  usrMsg(c.name);
  // give the AI context for later conversational questions
  state.history.push({role:'user',content:`I'm interested in the ${c.name} programme at SJU.`});
  state.history.push({role:'assistant',content:`Great choice! I can help you with ${c.name}. What would you like to know?`});
  botMsg(`<strong>${esc(c.name)}</strong> — great choice! 🎉<br>What would you like to know? Click an option below, or type any question.`);
  renderOptionCards();
}
function renderOptionCards(){
  const cards=OPTION_CARDS.map(o=>
    `<button class="opt-card" onclick="openOfficial('${o.key}','${o.icon}','${o.label}')"><span class="oc-ic">${o.icon}</span>${o.label}</button>`
  ).join('');
  rawBlock(`<div class="opt-cards">${cards}</div>`);
}
// Question named a subject that several programmes share - let the student pick
// rather than pointing the option cards at a programme they didn't ask about.
let _choices=[];
function renderCourseChoices(list){
  _choices=list;
  botMsg(`Which programme did you mean?`);
  rawBlock(`<div class="opt-cards">${list.map((c,i)=>
    `<button class="opt-card" onclick="selectCourse(_choices[${i}])"><span class="oc-ic">🎓</span>${esc(c.name)}</button>`
  ).join('')}</div>`);
}

// ── Official redirection (highest priority feature) ─────────────
function openOfficial(key, icon, label){
  const c=state.course; if(!c) return;
  const url=c[key];
  usrMsg(label);
  state.openedLinks.push(url);
  botMsg(`<a class="link-card" href="${url}" target="_blank" rel="noopener">${icon} ${esc(label)} — official page ↗</a>`);
  window.open(url,'_blank');
}

// ── Global quick actions (official pages, no AI) ─────────────────
const GLOBAL_ACTIONS = [
  { icon:"🎓", label:"Admissions",           url:"https://www.sju.edu.in/admissions/admissions" },
  { icon:"📋", label:"Application Status",   url:"https://sjuv4.linways.com/v4/adm-applicant/login" },
  { icon:"🏠", label:"Hostel",               url:"https://www.sju.edu.in/services/hostel/university-hostel" },
  { icon:"💰", label:"Scholarships",         url:"https://www.sju.edu.in/student-support/scholarships_page" },
  { icon:"💼", label:"Placements",           url:"https://www.sju.edu.in/placements/about-placements" },
  { icon:"📞", label:"Contact University",   url:"https://www.sju.edu.in/about/contact-us" },
];
function renderGlobalActions(){
  const cards=GLOBAL_ACTIONS.map((g,i)=>
    `<button class="opt-card" onclick="openGlobal(${i})"><span class="oc-ic">${g.icon}</span>${g.label}</button>`
  ).join('');
  rawBlock(`<div class="opt-cards">${cards}</div>`);
}
function openGlobal(i){
  const g=GLOBAL_ACTIONS[i]; if(!g) return;
  if(!state.course){ state.level=null; hideDrop(); syncInput(); }   // leave a half-done programme search
  usrMsg(g.label);
  state.openedLinks.push(g.url);
  botMsg(`<a class="link-card" href="${g.url}" target="_blank" rel="noopener">${g.icon} ${esc(g.label)} — official page ↗</a>`);
  window.open(g.url,'_blank');
}

// ── Send handling: search mode vs AI mode ────────────────────────
function handleSend(){
  const q=$inp().value.trim();
  if(!q) return;
  // In course-search mode: Enter selects highlighted or single match
  if(state.level && !state.course){
    const matches=filterCourses(q);
    const items=$drop().querySelectorAll('.sd-item');
    if(sdIndex>=0 && items[sdIndex]){ chooseCourseByName(items[sdIndex].dataset.name); return; }
    if(matches.length===1){ selectCourse(matches[0]); return; }
    if(matches.length>1){ showDrop(matches); return; }
    // no match: they typed their own question, so the programme search is over
    state.level=null; syncInput();
  }
  sendToAI(q);
}

let inflight=null;   // AbortController of the answer currently streaming
async function sendToAI(q){
  if(inflight) return;   // Enter pressed again while an answer is still streaming
  const btn=document.getElementById('cwBtn');
  $inp().value=''; hideDrop(); btn.disabled=true;
  usrMsg(q); showTyping();
  const ctrl=inflight=new AbortController();
  let ans='', bub=null, shown=0, streaming=true;
  // Text arrives in uneven bursts; reveal it a few letters per frame instead, a bit
  // faster when far behind, so it flows steadily. The pulsing dot = more is coming.
  const typed=new Promise(done=>{ (function tick(){
    if(ctrl.signal.aborted) return done();
    if(bub && shown<ans.length){
      shown=Math.min(ans.length, shown+Math.max(2,Math.ceil((ans.length-shown)/40)));
      bub.innerHTML=fmt(ans.slice(0,shown))+'<span class="stream-dot"></span>'; scrollDown(true);
    }
    if(!streaming && shown>=ans.length) return done();
    setTimeout(tick,16);   // not requestAnimationFrame: that stops in a background tab
  })(); });
  try{
    // Server-sent events: every "data:" line is a JSON string of answer text.
    // The typing dots stay until the first words.
    const r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,history:state.history}),signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const reader=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    for(;;){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const events=buf.split('\n\n'); buf=events.pop();
      for(const ev of events){
        if(!ev.startsWith('data: ')) continue;
        ans+=JSON.parse(ev.slice(6));
        if(!bub){ hideTyping(); bub=botMsg(''); }
      }
    }
  }catch(e){
    if(!ctrl.signal.aborted && ans) ans+='\n\n(The connection dropped - please ask again.)';
  }
  streaming=false;
  await typed;
  if(inflight===ctrl) inflight=null;
  btn.disabled=false; $inp().focus();
  if(ctrl.signal.aborted) return;   // Start Over wiped this conversation
  hideTyping();
  if(!ans){ botMsg('Sorry, something went wrong. Please try again.'); return; }
  if(!bub) bub=botMsg('');
  bub.innerHTML=fmt(ans);
  state.history.push({role:'user',content:q});
  state.history.push({role:'assistant',content:ans});
  if(state.history.length>20) state.history.splice(0,2);
  const m=matchCourses(q);
  const hit = m.exact.length===1 ? m.exact[0] : (m.exact.length===0 && m.loose.length===1 ? m.loose[0] : null);
  const stillCurrent = state.course && m.loose.some(c=>c.name===state.course.name);
  if(hit){
    state.course=hit; state.level=hit.level;
  }else if(m.loose.length>1 && !stillCurrent){
    // question moved to a different subject but didn't name one programme -
    // stale option cards here would send the student to the wrong page
    state.course=null; state.level=null;
    // ponytail: 6 buttons is a screenful; narrower matching would need real ranking
    renderCourseChoices((m.exact.length>1?m.exact:m.loose).slice(0,6));
  }
  if(state.course) renderOptionCards();   // keep options handy, pointed at the right programme
  syncInput();
}

// ── Input events: live search, keyboard nav, Enter to send ───────
document.addEventListener('DOMContentLoaded',function(){
  renderWelcome();
  const inp=$inp();
  inp.addEventListener('input',function(){
    if(state.level && !state.course) showDrop(filterCourses(inp.value.trim()));
  });
  inp.addEventListener('focus',function(){
    if(state.level && !state.course) showDrop(filterCourses(inp.value.trim()));
  });
  inp.addEventListener('keydown',function(e){
    const items=$drop().querySelectorAll('.sd-item');
    const dropOpen=$drop().classList.contains('show') && items.length;
    if(dropOpen && e.key==='ArrowDown'){ e.preventDefault(); sdIndex=Math.min(sdIndex+1,items.length-1); highlight(items); return; }
    if(dropOpen && e.key==='ArrowUp'){ e.preventDefault(); sdIndex=Math.max(sdIndex-1,0); highlight(items); return; }
    if(e.key==='Escape'){ hideDrop(); return; }
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.search-wrap') && !e.target.closest('.lvl-btn')) hideDrop();
  });
});
function highlight(items){
  items.forEach((el,i)=>el.classList.toggle('active',i===sdIndex));
  if(items[sdIndex]) items[sdIndex].scrollIntoView({block:'nearest'});
}
// Hosted in an iframe on the university site - the close button belongs to the
// launcher, so hand it back to the parent page instead of hiding ourselves.
function toggleChat(){ parent.postMessage('sju-chat-close','*'); }
</script>
