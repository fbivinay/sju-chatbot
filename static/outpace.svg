      <stop offset="1" stop-color="#0A95FF"/>
    </linearGradient>
    <mask id="hole"><rect width="2172" height="724" fill="#fff"/><ellipse cx="472" cy="345" rx="115" ry="123" fill="#000"/></mask>
    <clipPath id="noDesc"><rect width="2172" height="522"/></clipPath>
  </defs>

  <!-- O ring: tilted ellipse with an offset hole -->
  <g transform="rotate(-18 472 345)">
    <path fill="url(#ring)" fill-rule="evenodd"
      d="M255 345a217 216 0 1 0 434 0a217 216 0 1 0 -434 0Z
         M357 345a115 123 0 1 0 230 0a115 123 0 1 0 -230 0Z"/>
    <ellipse mask="url(#hole)" cx="430" cy="345" rx="146" ry="165" fill="url(#ringLight)"/>
  </g>

  <!-- swoosh crossing the O, white outline cuts it out of the ring -->
  <path fill="url(#swoosh)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" paint-order="stroke"
