<svg xmlns="http://www.w3.org/2000/svg" viewBox="185 95 1925 500" width="1925" height="500">
  <title>Outpace Technologies</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A63"/>
      <stop offset="1" stop-color="#0446AD"/>
    </linearGradient>
    <linearGradient id="ringLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A9BFF"/>
      <stop offset="1" stop-color="#0567D8"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5FC8"/>
      <stop offset="0.6" stop-color="#0A84EA"/>
      <stop offset="1" stop-color="#2FB4FF"/>
    </linearGradient>
    <linearGradient id="pace" gradientUnits="userSpaceOnUse" x1="1100" y1="0" x2="2100" y2="0">
      <stop offset="0" stop-color="#0469FB"/>
      <stop offset="1" stop-color="#0A95FF"/>
    </linearGradient>
    <mask id="hole"><rect width="2172" height="724" fill="#fff"/><ellipse cx="472" cy="345" rx="115" ry="123" fill="#000"/></mask>
    <clipPath id="noDesc"><rect width="2172" height="522"/></clipPath>
  </defs>

  <!-- O ring: tilted ellipse with an offset hole -->
  <g transform="rotate(-18 472 345)">
    <path fill="url(#ring)" fill-rule="evenodd"
      d="M255 345a217 216 0 1 0 434 0a217 216 0 1 0 -434 0Z
         M357 345a115 123 0 1 0 230 0a115 123 0 1 0 -230 0Z"/>
    <ellipse mask="url(#hole)" cx="430" cy="345" rx="146" ry="165" fill="url(#ringLight)"/>
  </g>

  <!-- swoosh crossing the O, white outline cuts it out of the ring -->
  <path fill="url(#swoosh)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" paint-order="stroke"
