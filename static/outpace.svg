<svg xmlns="http://www.w3.org/2000/svg" viewBox="185 95 1925 600" width="1925" height="600">
  <title>Outpace Technologies</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A63"/>
      <stop offset="1" stop-color="#0446AD"/>
    </linearGradient>
    <linearGradient id="ringLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A9BFF"/>
      <stop offset="1" stop-color="#0567D8"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5FC8"/>
      <stop offset="0.6" stop-color="#0A84EA"/>
      <stop offset="1" stop-color="#2FB4FF"/>
    </linearGradient>
    <linearGradient id="pace" gradientUnits="userSpaceOnUse" x1="1100" y1="0" x2="2100" y2="0">
