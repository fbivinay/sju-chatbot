name: Keep Supabase awake

# Supabase pauses a free project after 7 days without activity. The nightly
# scrape writes nothing when it captures nothing (site down or blocking us), so
# this writes a timestamp through public.keepalive() (supabase_setup.sql) twice
# a day regardless. If the call fails (for example the project is already
# paused), the run fails and GitHub emails you.

on:
  schedule:
    - cron: "0 3,15 * * *"   # 08:30 and 20:30 IST, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat to Supabase
        env:
          KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 -X POST \
            "https://mvszfevopamhkratxeak.supabase.co/rest/v1/rpc/keepalive" \
            -H "Content-Type: application/json" -d '{}' -H "apikey: $KEY"

  # GitHub switches off scheduled workflows in a public repo after 60 days without
  # commits. Re-enabling this workflow on every run resets that clock.
  keepalive:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keep-supabase-awake.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
