name: Refresh knowledge base

# Re-scrapes sju.edu.in every day and swaps the result into Supabase in one
# transaction (see scrape_playwright.py). A failed or suspiciously small scrape
# leaves the previous knowledge base live, and GitHub emails the repo owner.
#
# Needs one repository secret: SUPABASE_SECRET_KEY, a Supabase secret key
# (sb_secret_..., Supabase > Project Settings > API Keys > Secret keys).

on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST, every day
  workflow_dispatch:
    inputs:
      min_ratio:
        description: "Refuse a scrape smaller than this share of the live table (lower it only if SJU removed many pages)"
        default: "0.6"

concurrency:
  group: refresh-knowledge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: playwright --with-deps needs an Ubuntu it supports
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4 supabase defusedxml
      - run: python -m playwright install --with-deps chromium
      - run: python scrape_playwright.py
        env:
          SUPABASE_URL: https://mvszfevopamhkratxeak.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIN_RATIO: ${{ inputs.min_ratio || '0.6' }}
          PYTHONUNBUFFERED: "1"

  # GitHub switches off scheduled workflows in a public repo after 60 days without
  # commits; the daily scrape is also what keeps Supabase from pausing. Re-enabling
  # this workflow on every run resets that 60-day clock, even when the scrape fails.
  keepalive:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable refresh-knowledge.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
